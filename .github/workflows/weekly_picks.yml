name: Weekly NFL Picks

on:
  schedule:
    # Every Tuesday 13:00 UTC (~9am ET), after most books post the week's props
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: true
        default: "2026"
      week:
        description: "NFL week number"
        required: true
        default: "1"

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly picks
        env:
          PARLAYAPI_KEY: ${{ secrets.PARLAYAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/weekly_picks.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --week "${{ github.event.inputs.week || '1' }}"

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks
          path: cache/*.csv
