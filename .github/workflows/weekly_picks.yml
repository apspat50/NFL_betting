name: NFL Picks - Game Day Runs

on:
  schedule:
    # All times UTC. NFL is Eastern-time; these land around mid-morning
    # ET whether EDT (UTC-4, Sep-early Nov) or EST (UTC-5, rest of season) --
    # early enough that props are posted, well before any kickoff.
    - cron: "0 14 * * 4"  # Thursday ~10am ET -- before Thursday Night Football
    - cron: "0 14 * * 0"  # Sunday ~10am ET -- before the full Sunday slate
    - cron: "0 14 * * 1"  # Monday ~10am ET -- before Monday Night Football
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (leave blank to auto-detect)"
        required: false
      week:
        description: "NFL week number (leave blank to auto-detect)"
        required: false
      game_date:
        description: "YYYY-MM-DD to filter picks to (leave blank for today)"
        required: false
      model_type:
        description: "Model type for training (gbr/rf/ridge/hgb) -- see scripts/backtest.py to compare"
        required: false
        default: "gbr"

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install nfl_data_py --no-deps
          pip install -r requirements.txt

      - name: Train models
        run: |
          python scripts/train_models.py --seasons 2019 2020 2021 2022 2023 2024 \
            --model-type "${{ github.event.inputs.model_type || 'gbr' }}"

      - name: Run picks for today's game(s)
        env:
          PARLAYAPI_KEY: ${{ secrets.PARLAYAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/weekly_picks.py \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }} \
            ${{ github.event.inputs.game_date && format('--game-date {0}', github.event.inputs.game_date) || '' }}

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: cache/*.csv
